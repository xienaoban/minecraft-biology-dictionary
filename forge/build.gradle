plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "biologydictionary.mixins.json"
        mixinConfig "biologydictionary-forge.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }

    // JEI API (optional compatibility)
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${rootProject.mixinextras_version}"))
    implementation(include("io.github.llamalad7:mixinextras-forge:${rootProject.mixinextras_version}"))

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"

    // Cloth Config for Forge
    modImplementation "me.shedaniel.cloth:cloth-config-forge:${rootProject.clothconfig_version}"

    // SnakeYAML for config file parsing
    modImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    forgeRuntimeLibrary "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    include "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // JEI API (optional compatibility)
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-forge-api:${rootProject.jei_version}"
    localRuntime "mezz.jei:jei-${rootProject.minecraft_version}-forge:${rootProject.jei_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
