plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge'
    id 'idea'
}

version = mod_version
group = maven_group

base {
    archivesName = "${mod_id}-forge"
}

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // JEI API (optional compatibility)
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Forge 1.20.1 uses SRG names at runtime, so the mixins need a refmap that maps the Mojang names
// used in the sources to SRG names. `add` gives the annotation processor its compiler arguments and
// puts the generated refmap into the jar; the configs listed below are the ones that refmap belongs
// to. ModDevGradle does not inject the "refmap" key into them, so processResources does that.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}-forge.mixins.json"
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    commonJava {
        canBeResolved = true
        canBeConsumed = false
    }
    commonResources {
        canBeResolved = true
        canBeConsumed = false
    }
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
    // See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.

    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
    jarJar "org.yaml:snakeyaml:${project.snakeyaml_version}"
    // Forge 1.20.1 only loads external dependencies in dev runs when they are explicitly added to the
    // additional runtime classpath; otherwise the dev launch drops them and the game dies with
    // ClassNotFoundException. NeoForge 1.21.9+ (see the 1.21.11 module) needs no such line.
    additionalRuntimeClasspath "org.yaml:snakeyaml:${project.snakeyaml_version}"
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
    jarJar "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
    // MixinExtras bootstraps itself from its own mixin config plugin, which Forge only reads when the
    // jar is discovered as a mod (or game library) file. A plain classpath entry is not enough, so the
    // dev run needs it as a mod, while the jar nests it with jarJar for production.
    modLocalRuntime "io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"
    // Forge 1.20.1 runs on SRG names, so the mixins need a refmap. ModDevGradle only supplies the
    // compiler arguments for it; the annotation processor that actually emits the refmap is ours.
    annotationProcessor "org.spongepowered:mixin:${project.mixin_version}:processor"
    modCompileOnly "me.shedaniel.cloth:cloth-config-forge:${project.clothconfig_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-forge:${project.clothconfig_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
    modCompileOnly "mezz.jei:jei-${project.minecraft_version}-forge-api:${project.jei_version}"
    modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}"

    commonJava project(path: ":common", configuration: "commonJava")
    commonResources project(path: ":common", configuration: "commonResources")
}

tasks.named("compileJava", JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)

    def replaceProperties = [
            version              : project.version,
            mod_id               : project.mod_id,
            mod_name             : project.mod_name,
            mod_license          : project.mod_license,
            minecraft_version    : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version        : project.forge_version,
            forge_version_range  : project.forge_version_range,
            loader_version_range : project.loader_version_range,
            clothconfig_version  : project.clothconfig_version
    ]
    inputs.properties replaceProperties

    filesMatching("META-INF/mods.toml") {
        expand replaceProperties
    }

    // Forge 1.20.1 runs on SRG names, so both mixin configs have to point at the refmap emitted by
    // the Mixin annotation processor. Fabric needs no refmap -- Loom remaps the mixin annotations
    // itself -- so the shared configs in :common stay clean and the key is added only for this jar.
    doLast {
        def refmapName = "${mod_id}.refmap.json"
        ["${mod_id}.mixins.json", "${mod_id}-forge.mixins.json"].each { name ->
            def configFile = destinationDir.toPath().resolve(name).toFile()
            if (!configFile.exists()) { return }
            def config = new groovy.json.JsonSlurper().parse(configFile)
            config.refmap = refmapName
            configFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config)) + '\n'
        }
    }
}

tasks.named("sourcesJar", Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
