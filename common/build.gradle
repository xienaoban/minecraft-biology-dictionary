plugins {
	id "java-library"
	id "net.fabricmc.fabric-loom"
}

base {
	archivesName = "${mod_id}-common"
}

loom {
	accessWidenerPath = file("src/main/resources/biologydictionary.accesswidener")
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	compileOnly "net.fabricmc:fabric-loader:${loader_version}"
	implementation "org.yaml:snakeyaml:${snakeyaml_version}"
	compileOnly "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
