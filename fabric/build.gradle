plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

sourceSets {
    testServer {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
        compileClasspath += project(':common').sourceSets.testServer.output
        runtimeClasspath += project(':common').sourceSets.testServer.output
    }
    testClient {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
        compileClasspath += project(':common').sourceSets.testClient.output
        runtimeClasspath += project(':common').sourceSets.testClient.output
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    runs {
        testServer {
            server()
            source sourceSets.testServer
            vmArg "--enable-native-access=ALL-UNNAMED"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/junit.xml"
            runDir "build/testServer"
        }
        testClient {
            client()
            source sourceSets.testClient
            ideConfigGenerated project.rootProject == project
            runDir "build/testServer"
        }
    }
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.shedaniel.me/" }

    // JEI API (optional compatibility)
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Fabric-specific dependencies
    modImplementation "com.terraformersmc:modmenu:$rootProject.fabric_modmenu_version"

    // Common dependencies for both platforms
    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.clothconfig_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // SnakeYAML for config file parsing
    modImplementation "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"
    include "org.yaml:snakeyaml:${rootProject.snakeyaml_version}"

    // JEI API (optional compatibility)
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    localRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Test dependencies from common
    testServerImplementation "com.github.javaparser:javaparser-symbol-solver-core:${rootProject.javaparser_version}"
    testServerImplementation "org.bitbucket.mstrobel:procyon-compilertools:${rootProject.procyon_version}"
    testServerImplementation "org.vineflower:vineflower:${rootProject.vineflower_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    inputs.property 'fabric_loader_version', rootProject.fabric_loader_version
    inputs.property 'modmenu_version', rootProject.fabric_modmenu_version
    inputs.property 'clothconfig_version', rootProject.clothconfig_version
    filteringCharset "UTF-8"

    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version,
                'minecraft_version': inputs.properties.minecraft_version,
                'fabric_loader_version': inputs.properties.fabric_loader_version,
                'modmenu_version': inputs.properties.modmenu_version,
                'clothconfig_version': inputs.properties.clothconfig_version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}